body{

  color:#111;
  min-height:100vh;
  display:flex;
  flex-direction:column;

a{text-decoration:none;color:inherit}

/* ===== IKLAN (ANTI BLANK) ===== */
.ad-sticky-top{
  position: sticky;
  top: 12px;
  z-index: 999;
  width: 100%;
  min-height: 260px; /* PENTING */
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px 0;
  background:#fff;
}

/* ===== HEADER ===== */
.main-header{
  border-bottom:1px solid #e5e7eb;
  padding:14px 0;
}
.header-container{
  max-width:1170px;
  margin:auto;
  padding:0 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.header-title{
  font-size:26px;
  font-weight:700;
}
.header-upload-btn{
  background:#f3f4f6;
  padding:8px 16px;
  border-radius:16px;
  font-weight:600;
}

/* ===== PAGE ===== */
.video-page{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-top:24px;
}

/* ===== PLAYER ===== */
.video-card{
  width:820px;
  max-width:95vw;
  aspect-ratio:16/9;
  background:#000;
  border-radius:16px;
  overflow:hidden;
}

video{
  width:100%;
  height:100%;
  background:#000;
  object-fit:contain;
}

/* ===== MOBILE ===== */
@media(max-width:768px){
  .main-header{display:none}
  .video-page{margin-top:0}

  .video-card{
    width:100%;
    max-width:420px;
    aspect-ratio:9/16;
    border-radius:0;
  }

  .ad-sticky-top{
    top:6px;
    padding:8px 0;
  }
}

/* ===== FOOTER ===== */
footer{
  margin-top:auto;
  padding:20px;
  text-align:center;
  font-size:14px;
  color:#777;
}
</style>

<!-- IKLAN -->
