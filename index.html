    <script>
        const video = document.getElementById("video");
        const shareBtn = document.getElementById("btnShare");

        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        if (!id) {
            throw new Error("No video ID in URL");
        }

        const baseUrl = "https://cdn.videy.co/" + id;

        function tryLoadVideo(format) {
            video.src = baseUrl + format;
            video.load();
        }

        // Mulai dengan .mp4
        tryLoadVideo(".mp4");

        // Fallback ke .mov jika gagal
        video.onerror = () => {
            if (!video.dataset.triedFallback) {
                video.dataset.triedFallback = "true";
                tryLoadVideo(".mov");
            } 
        };

        // Tombol Share
        shareBtn.addEventListener("click", () => {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: "Lihat video ini",
                    url: url
                }).catch(err => console.log("Share dibatalkan", err));
            } else {
                navigator.clipboard.writeText(url)
                    .then(() => alert("Link video berhasil disalin!"))
                    .catch(() => alert("Gagal menyalin link"));
            }
        });
