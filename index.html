  <script>
    const video = document.getElementById("video");

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (!id) {
      document.body.innerHTML = "<div style='text-align:center;margin-top:50px;font-size:18px;'>Video ID not found try reloading the page.</div>";
      throw new Error("No video ID");
    }

    const base = "https://cdn.videy.co/" + id;

    function loadVideo(src) {
      video.src = src;
      video.load();
    }

    loadVideo(base + ".mp4");

    video.onerror = function () {
      if (!video.dataset.triedMov) {
        video.dataset.triedMov = "true";
        loadVideo(base + ".mov");
      } else {
        video.parentElement.innerHTML =
          "<div style='color:black;padding:20px;text-align:center;'>Video tidak dapat diputar.</div>";
      }
    };

    function shareVideo() {
      if (navigator.share) {
        navigator.share({
          title: "Watch this video",
          url: location.href
        });
      } else {
        navigator.clipboard.writeText(location.href);
        alert("Link copied!");
      }
    }
